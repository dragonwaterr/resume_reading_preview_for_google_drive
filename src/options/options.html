<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle"></title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 16px 20px;
      min-width: 320px;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
    }
    .row input { margin: 3px 0 0; }
    .hint {
      display: block;
      color: GrayText;
      font-size: 12px;
    }
    #status {
      min-height: 1.5em;
      margin: 12px 0 0;
      font-size: 12px;
      color: GrayText;
    }
  </style>
</head>
<body>
  <label class="row">
    <input type="checkbox" id="toast">
    <span>
      <span data-i18n="optionsToastLabel"></span>
      <span class="hint" data-i18n="optionsToastHint"></span>
    </span>
  </label>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
